<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1d1d1f;
      --muted: #86868b;
      --hair: #e8e8ed;
      --fill: #f5f5f7;
      --blue: #0071e3;
      --blue-press: #0062c4;
      --green: #30d158;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      color: var(--ink); -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
      min-height: 100vh; min-height: 100dvh;
      padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
    header p { margin: 4px 0 0; font-size: 17px; color: var(--muted); }

    /* Status: the one animated element */
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .badge { position: relative; width: 112px; height: 112px; border-radius: 50%;
      background: var(--fill); display: grid; place-items: center; transition: background-color .3s; }
    .badge > svg { position: absolute; }
    .badge .doc { width: 48px; height: 48px; color: var(--muted); transition: opacity .2s, transform .3s; }
    .badge .ring { inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); opacity: 0; transition: opacity .2s; }
    .badge .ring circle { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .35s ease; }
    .badge .check, .badge .bang { width: 52px; height: 52px; opacity: 0; }
    .badge .check path { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; }
    .badge .bang path { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }

    .badge.busy .ring { opacity: 1; }
    .badge.busy .doc { color: var(--blue); }
    .badge.indet .ring { animation: spin 1s linear infinite; }
    .badge.done { background: var(--green); }
    .badge.done .doc { opacity: 0; transform: scale(.6); }
    .badge.done .check { opacity: 1; }
    .badge.done .check path { animation: draw .45s .05s cubic-bezier(.65,0,.35,1) forwards; }
    .badge.fail { background: var(--red); }
    .badge.fail .doc { opacity: 0; }
    .badge.fail .bang { opacity: 1; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }

    .msg { text-align: center; display: flex; flex-direction: column; gap: 4px; }
    #status { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; min-height: 28px; }
    #hint { font-size: 15px; color: var(--muted); margin: 0; min-height: 20px; }

    /* Two buttons, identical size */
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      height: 150px; border-radius: 24px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
      transition: transform .15s cubic-bezier(.3,.7,.4,1.4), background-color .15s;
      -webkit-user-select: none; user-select: none;
    }
    .btn svg { width: 40px; height: 40px; }
    .btn:active { transform: scale(.96); }
    .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.primary:active { background: var(--blue-press); }
    .btn.secondary { background: var(--fill); color: var(--blue); }
    .btn.secondary:active { background: var(--hair); }
    body.locked .btn { opacity: .45; pointer-events: none; }

    #count { font-size: 13px; color: var(--muted); text-align: center; min-height: 16px; margin-top: 14px; }

    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation-duration: .01ms !important; }
      .badge.done .check path { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1><?= title ?></h1>
    <p id="today"></p>
  </header>

  <main>
    <div id="badge" class="badge" aria-hidden="true">
      <svg class="ring" viewBox="0 0 128 128"><circle id="arc" cx="64" cy="64" r="61"/></svg>
      <svg class="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h12v18l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3L6 21z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/>
      </svg>
      <svg class="check" viewBox="0 0 52 52"><path d="M14 27l8 8 16-17"/></svg>
      <svg class="bang" viewBox="0 0 52 52"><path d="M26 14v15M26 37v.5"/></svg>
    </div>
    <div class="msg">
      <p id="status" role="status" aria-live="polite">Ready</p>
      <p id="hint">Receipts get sorted automatically</p>
    </div>
  </main>

  <div class="actions">
    <label class="btn primary" for="cam" tabindex="0" role="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.6l1.3-1.9A1.5 1.5 0 0 1 9.6 3.5h4.8a1.5 1.5 0 0 1 1.2.6L16.9 6h1.6A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.8"/>
      </svg>
      Take photo
    </label>
    <label class="btn secondary" for="gal" tabindex="0" role="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-9 9"/>
      </svg>
      Import
    </label>
  </div>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <input id="gal" type="file" accept="image/*" multiple>
  <div id="count"></div>

<script>
  const KEY = <?= k ?>;
  const $ = id => document.getElementById(id);
  const badge = $('badge'), statusEl = $('status'), hintEl = $('hint'), countEl = $('count'), arc = $('arc');
  const CIRC = 2 * Math.PI * 61;
  arc.style.strokeDasharray = CIRC;

  const d = new Date();
  $('today').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  // Today's count (this phone only)
  const dayKey = 'receipts-' + d.toISOString().slice(0, 10);
  function readCount() { try { return Number(localStorage.getItem(dayKey)) || 0; } catch (e) { return 0; } }
  function addCount(n) { const v = readCount() + n; try { localStorage.setItem(dayKey, v); } catch (e) {} return v; }
  function showCount(v) { countEl.textContent = v ? (v === 1 ? '1 receipt uploaded today' : v + ' receipts uploaded today') : ''; }
  showCount(readCount());

  let resetTimer;
  function setState(state, status, hint) {
    clearTimeout(resetTimer);
    badge.classList.remove('busy', 'indet', 'done', 'fail');
    if (state) state.split(' ').forEach(c => badge.classList.add(c));
    document.body.classList.toggle('locked', /busy/.test(state));
    statusEl.textContent = status;
    hintEl.textContent = hint || '';
  }
  function idle() { setState('', 'Ready', 'Receipts get sorted automatically'); }
  function progress(frac) { arc.style.strokeDashoffset = CIRC * (1 - frac); }

  // Resize to max 2000px JPEG: faster upload, cheaper AI
  function resize(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
      img.src = url;
    });
  }

  function upload(b64) {
    return new Promise((res, rej) =>
      google.script.run.withSuccessHandler(res).withFailureHandler(rej).uploadReceipt(KEY, b64, 'image/jpeg'));
  }

  async function handle(files) {
    if (!files.length) return;
    const n = files.length;
    let ok = 0, fail = 0, lastErr = '';
    progress(n === 1 ? 0.25 : 0);
    setState(n === 1 ? 'busy indet' : 'busy', 'Uploading…', n > 1 ? `0 of ${n}` : '');
    for (let i = 0; i < n; i++) {
      try { await upload(await resize(files[i])); ok++; }
      catch (e) { fail++; lastErr = (e && e.message) ? e.message : String(e); console.error(e); }
      if (n > 1) { progress((i + 1) / n); hintEl.textContent = `${i + 1} of ${n}`; }
    }
    if (ok) showCount(addCount(ok));

    if (fail) {
      setState('fail', ok ? `${ok} uploaded, ${fail} failed` : 'Upload failed',
               lastErr ? lastErr.slice(0, 140) : 'Check your connection and try again');
      resetTimer = setTimeout(idle, 5000);
    } else {
      setState('done', n === 1 ? 'Uploaded' : `${ok} receipts uploaded`, 'Ready for the next one');
      resetTimer = setTimeout(idle, 2200);
    }
  }

  ['cam', 'gal'].forEach(id => {
    $(id).addEventListener('change', e => {
      const files = [...e.target.files];
      e.target.value = '';
      handle(files);
    });
  });
  document.querySelectorAll('label[role=button]').forEach(l =>
    l.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(l.htmlFor).click(); }
    }));
</script>
</body>
</html>
